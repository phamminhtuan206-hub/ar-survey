<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Khảo Sát Bất Động Sản Pro v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; }
    
    /* Tâm ngắm định vị giữa màn hình */
    #reticle-ui {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      border: 2px solid rgba(0, 240, 255, 0.8);
      border-radius: 50%;
      z-index: 15;
      pointer-events: none;
    }
    #reticle-ui::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 4px;
      background: #00f0ff;
      border-radius: 50%;
    }
  </style>
</head>
<body class="text-white font-sans select-none">

  <!-- Camera Stream làm nền -->
  <video id="video-bg" autoplay playsinline muted></video>
  
  <!-- Canvas Three.js -->
  <div id="canvas-container"></div>

  <!-- Con trỏ định vị trung tâm -->
  <div id="reticle-ui"></div>

  <!-- HUD Header -->
  <div class="fixed top-0 left-0 right-0 z-20 p-4 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <div>
        <h1 class="text-base font-bold text-cyan-400 tracking-wider">AR SURVEY PRO v2.0</h1>
        <p id="instruction" class="text-xs text-gray-300">Đưa tâm ngắm vào góc mặt tiền & chạm màn hình</p>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-gray-400 block uppercase">Mỏ neo 3D</span>
        <div id="point-count" class="text-lg font-black text-amber-400">0 / 4</div>
      </div>
    </div>
  </div>

  <!-- Bảng thông số đo đạc & Lưu dữ liệu -->
  <div id="info-panel" class="fixed bottom-6 left-4 right-4 z-20 hidden bg-slate-900/90 border border-cyan-500/50 p-4 rounded-xl backdrop-blur-md max-w-md mx-auto shadow-2xl">
    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-2 tracking-wide">Kích thước mặt tiền (Ước tính)</h3>
    <div class="grid grid-cols-3 gap-2 text-center mb-3">
      <div class="bg-slate-800/80 p-2 rounded-lg border border-slate-700">
        <span class="text-[10px] text-gray-400 block">Chiều rộng</span>
        <p id="width-val" class="text-sm font-bold text-white">0.00 m</p>
      </div>
      <div class="bg-slate-800/80 p-2 rounded-lg border border-slate-700">
        <span class="text-[10px] text-gray-400 block">Chiều cao</span>
        <p id="height-val" class="text-sm font-bold text-white">0.00 m</p>
      </div>
      <div class="bg-slate-800/80 p-2 rounded-lg border border-slate-700">
        <span class="text-[10px] text-gray-400 block">Diện tích</span>
        <p id="area-val" class="text-sm font-bold text-green-400">0.00 m²</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="resetPoints()" class="w-1/3 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition">Đo lại</button>
      <button id="save-btn" onclick="saveDataDirectly()" class="w-2/3 py-2.5 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xs font-bold transition">Lưu vào Google Sheet</button>
    </div>
  </div>

  <script>
    // *** DÁN URL GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY ***
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx3w-5j3oWFKABnpw9HINSjWokCkJExXX3fmR8eDTJg7mnPBlvc4TBNsxd936u8PUA7/exec";

    const video = document.getElementById('video-bg');
    const container = document.getElementById('canvas-container');
    const reticleUI = document.getElementById('reticle-ui');

    let scene, camera, renderer, raycaster, mouse;
    const points = [], pointMarkers = [];
    let frameLine = null, surfacePlane = null;
    let measuredWidth = 0, measuredHeight = 0, measuredArea = 0;

    // Biến cho bộ lọc mượt góc quay (Gyro Smooth Filter)
    let rawQuaternion = new THREE.Quaternion();
    let targetQuaternion = new THREE.Quaternion();

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Lỗi truy cập Camera: " + err.message);
      }
    }

    // Lắng nghe cảm biến con quay hồi chuyển & Chuẩn hóa
    function initSensors() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (event) => {
          if (event.alpha === null || event.beta === null || event.gamma === null) return;

          const alpha = THREE.MathUtils.degToRad(event.alpha);
          const beta = THREE.MathUtils.degToRad(event.beta);
          const gamma = THREE.MathUtils.degToRad(event.gamma);

          const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
          rawQuaternion.setFromEuler(euler);
        });
      }
    }

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 3); // Đặt camera lùi ra 3m chuẩn định dạng

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      window.addEventListener('resize', onWindowResize);
      container.addEventListener('pointerdown', onPointerDown);

      animate();
    }

    // Xử lý Chạm chọn điểm mỏ neo 3D
    function onPointerDown(event) {
      if (points.length >= 4) return;

      // Lấy tọa độ điểm chạm trên màn hình
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      let intersectPoint = new THREE.Vector3();

      if (points.length === 0) {
        // ĐIỂM SỐ 1: Bắn tia tạo Mặt phẳng Khảo sát ngay vị trí camera ngắm tới (Cách 2.5m)
        const forwardDir = new THREE.Vector3();
        camera.getWorldDirection(forwardDir);
        intersectPoint.copy(camera.position).add(forwardDir.multiplyScalar(2.5));

        // Khóa mặt phẳng cố định cho các điểm tiếp theo dựa trên Điểm #1
        const planeNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion);
        surfacePlane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, intersectPoint);
      } else {
        // ĐIỂM 2, 3, 4: Bắn tia cắt chính xác vào Mặt phẳng đã khóa từ Điểm #1
        const intersects = raycaster.ray.intersectPlane(surfacePlane, intersectPoint);
        if (!intersects) {
          // Fallback an toàn nếu tia bị chệch mặt phẳng
          intersectPoint.copy(raycaster.ray.origin).add(raycaster.ray.direction.multiplyScalar(2.5));
        }
      }

      // Tạo Mỏ neo 3D (Quả cầu vàng + Viền Cyan)
      const markerGroup = new THREE.Group();
      
      const coreMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xf59e0b })
      );
      const ringMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.1, 32),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide })
      );
      ringMesh.quaternion.copy(camera.quaternion);

      markerGroup.add(coreMesh);
      markerGroup.add(ringMesh);
      markerGroup.position.copy(intersectPoint);

      scene.add(markerGroup);
      points.push(intersectPoint);
      pointMarkers.push(markerGroup);

      document.getElementById('point-count').innerText = `${points.length} / 4`;

      if (points.length === 4) {
        drawFrame();
        calculateDimensions();
        reticleUI.style.display = 'none';
        document.getElementById('instruction').innerText = "Đã khóa 4 mỏ neo không gian!";
        document.getElementById('info-panel').classList.remove('hidden');
      } else {
        document.getElementById('instruction').innerText = `Chạm để chọn góc thứ ${points.length + 1}`;
      }
    }

    // Vẽ khung kết nối 4 mỏ neo 3D
    function drawFrame() {
      if (frameLine) scene.remove(frameLine);
      const linePoints = [points[0], points[1], points[2], points[3], points[0]];
      const geometry = new THREE.BufferGeometry().setFromPoints(linePoints);
      const material = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 3 });
      frameLine = new THREE.Line(geometry, material);
      scene.add(frameLine);
    }

    // Tính kích thước hình học không gian 3D
    function calculateDimensions() {
      // Tính khoảng cách Euclide thực tế trong không gian 3D
      measuredWidth = points[0].distanceTo(points[1]); 
      measuredHeight = points[1].distanceTo(points[2]);
      measuredArea = measuredWidth * measuredHeight;

      document.getElementById('width-val').innerText = `${measuredWidth.toFixed(2)} m`;
      document.getElementById('height-val').innerText = `${measuredHeight.toFixed(2)} m`;
      document.getElementById('area-val').innerText = `${measuredArea.toFixed(2)} m²`;
    }

    window.resetPoints = function() {
      points.length = 0;
      pointMarkers.forEach(m => scene.remove(m));
      pointMarkers.length = 0;
      if (frameLine) scene.remove(frameLine);
      surfacePlane = null;

      reticleUI.style.display = 'block';
      document.getElementById('point-count').innerText = "0 / 4";
      document.getElementById('instruction').innerText = "Đưa tâm ngắm vào góc mặt tiền & chạm màn hình";
      document.getElementById('info-panel').classList.add('hidden');
    };

    window.saveDataDirectly = function() {
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Đang lưu...";

      const payload = {
        width: measuredWidth.toFixed(2),
        height: measuredHeight.toFixed(2),
        area: measuredArea.toFixed(2),
        points: points.map(p => ({ x: p.x.toFixed(3), y: p.y.toFixed(3), z: p.z.toFixed(3) }))
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Đã lưu kết quả khảo sát vào Google Sheet thành công!");
        saveBtn.disabled = false;
        saveBtn.innerText = "Lưu vào Google Sheet";
      })
      .catch(err => {
        alert("Lỗi lưu dữ liệu: " + err);
        saveBtn.disabled = false;
        saveBtn.innerText = "Lưu vào Google Sheet";
      });
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Vòng lặp Render chính
    function animate() {
      requestAnimationFrame(animate);

      // Thuật toán làm mượt góc quay (Slerp Filter) với hệ số mượt alpha = 0.1
      targetQuaternion.slerp(rawQuaternion, 0.1);
      camera.quaternion.copy(targetQuaternion);

      renderer.render(scene, camera);
    }

    startCamera();
    initSensors();
    init3D();
  </script>
</body>
</html>
