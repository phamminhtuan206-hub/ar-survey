<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartVal Pro - AR Field Survey & Saved Polygons</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- QRious JS Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #050b14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    #view-viewport {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 50vh;
      overflow: hidden;
      background: #000;
      border-bottom: 2px solid rgba(56, 189, 248, 0.4);
      transition: height 0.3s ease;
    }

    #video-bg, #freeze-canvas, #canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #canvas-container {
      z-index: 2;
      pointer-events: auto;
    }

    #osm-mini-map {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 130px; height: 110px;
      z-index: 10;
      border: 2px solid #0284c7;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.6);
      overflow: hidden;
    }

    #reticle-ui {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      z-index: 15;
      pointer-events: none;
    }
    #reticle-ui::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 2px solid rgba(56, 189, 248, 0.6);
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
    }
    #reticle-ui::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 4px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .hud-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #f8fafc;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-family: monospace;
      outline: none;
      transition: all 0.2s;
    }
    .hud-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .btn-action-glow {
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .btn-action-glow:active {
      transform: scale(0.94);
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.9), 0 0 30px rgba(16, 185, 129, 0.6);
      filter: brightness(1.25);
    }

    .tab-btn-active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body class="text-slate-100 select-none">

  <!-- KHU VỰC AR VIEWPORT PHÍA TRÊN -->
  <div id="view-viewport">
    <video id="video-bg" autoplay playsinline muted></video>
    <canvas id="freeze-canvas" class="hidden"></canvas>
    <div id="canvas-container"></div>
    <div id="reticle-ui"></div>

    <!-- BẢN ĐỒ NHỎ OSM -->
    <div id="osm-mini-map" class="hidden"></div>

    <!-- Header HUD -->
    <header class="absolute top-0 left-0 right-0 z-20 p-2 bg-gradient-to-b from-slate-950/90 via-slate-950/40 to-transparent pointer-events-none">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <div class="w-7 h-7 rounded-lg bg-sky-500/20 border border-sky-400/50 flex items-center justify-center backdrop-blur-md">
            <i data-lucide="box" class="w-4 h-4 text-sky-400"></i>
          </div>
          <div>
            <div class="flex items-center gap-1">
              <span class="text-xs font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-emerald-400">SmartVal</span>
              <span class="text-[10px] px-1 py-0.2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded font-semibold">Pro</span>
            </div>
            <p id="instruction" class="text-[10px] text-slate-300">Chạm màn hình chọn 4 điểm</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 bg-slate-900/80 border border-slate-700/60 pl-2 pr-2.5 py-0.5 rounded-full backdrop-blur-md">
          <div class="w-5 h-5 rounded-full bg-sky-600/40 border border-sky-400/60 flex items-center justify-center text-[9px] font-bold text-sky-300">
            PT
          </div>
          <div class="text-right">
            <p class="text-[9px] font-medium text-slate-300 leading-tight">Chuyên gia thẩm định</p>
            <p class="text-[10px] font-bold text-sky-400 leading-tight">Phạm Minh Tuấn</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Live Status HUD -->
    <div class="absolute top-11 left-0 right-0 z-20 px-2.5 pointer-events-none">
      <div class="max-w-md mx-auto flex justify-between items-center text-[10px]">
        <div class="flex items-center gap-1.5 bg-slate-950/70 border border-slate-800/80 px-2 py-0.5 rounded backdrop-blur-md">
          <span class="relative flex h-1.5 w-1.5">
            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="status-dot" class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
          </span>
          <span id="status-text" class="text-slate-300 font-mono text-[9px]">LIVE</span>
        </div>

        <div class="flex items-center gap-1 bg-slate-950/80 border border-sky-500/30 px-2 py-0.5 rounded backdrop-blur-md text-sky-300 font-mono text-[9px]">
          <i data-lucide="clock" class="w-2.5 h-2.5 text-sky-400"></i>
          <span id="realtime-clock">--/--/---- --:--:--</span>
        </div>

        <div class="flex items-center gap-1 bg-slate-950/70 border border-slate-800/80 px-2 py-0.5 rounded backdrop-blur-md">
          <span class="text-slate-400 uppercase text-[9px]">ĐIỂM:</span>
          <span id="point-count" class="font-mono font-bold text-amber-400 text-[10px]">0 / 4</span>
        </div>
      </div>
    </div>

    <!-- Floating Action Buttons -->
    <div id="floating-actions" class="absolute top-20 right-2.5 z-30 hidden flex-col gap-1.5">
      <button onclick="toggleInfoPanel()" class="p-2 bg-slate-900/90 border border-sky-500/50 hover:bg-slate-800 rounded-full text-sky-400 shadow-lg backdrop-blur-md transition active:scale-95">
        <i id="toggle-icon" data-lucide="eye-off" class="w-4 h-4"></i>
      </button>
      <button onclick="takeScreenshot()" class="p-2 bg-emerald-600/90 border border-emerald-400/50 hover:bg-emerald-500 rounded-full text-white shadow-lg backdrop-blur-md transition active:scale-95">
        <i data-lucide="camera" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN NỬA DƯỚI DẠNG TAB MENU -->
  <div id="info-panel" class="fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto bg-slate-950 border-t border-sky-500/40 p-2.5 shadow-2xl transition-all duration-300 h-[50vh] flex flex-col justify-between">
    
    <!-- THANH MENU TAB CHUYỂN ĐỔI CHỨC NĂNG -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-1.5">
      <div class="flex gap-1.5">
        <button id="tab-survey-btn" onclick="switchTab('survey')" class="px-3 py-1 bg-slate-900 border border-slate-700 rounded-lg text-[11px] text-slate-300 flex items-center gap-1 transition tab-btn-active">
          <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
          <span>Khảo sát AR</span>
        </button>
        <button id="tab-polygon-btn" onclick="switchTab('polygon')" class="px-3 py-1 bg-slate-900 border border-slate-700 rounded-lg text-[11px] text-slate-300 flex items-center gap-1 transition">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
          <span>Ranh GPS (<span id="saved-count">0</span>/5)</span>
        </button>
      </div>

      <button onclick="getLocationGPS()" class="flex items-center gap-1 px-2 py-0.5 bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/50 rounded text-[10px] text-sky-300 font-medium transition active:scale-95">
        <i data-lucide="crosshair" class="w-3 h-3 text-sky-400"></i>
        <span>GPS</span>
      </button>
    </div>

    <!-- TAB 1: NỘI DUNG KHẢO SÁT HIỆN TRƯỜNG -->
    <div id="tab-content-survey" class="flex-1 overflow-y-auto">
      <div class="mb-1.5">
        <input id="input-address" type="text" class="hud-input w-full font-sans text-xs text-slate-100 font-semibold" value="" placeholder="Nhập địa chỉ bất động sản..." oninput="generateValuationQR()">
        <div class="flex items-center gap-1 mt-1 text-[10px] text-slate-400 font-mono">
          <span>Tọa độ:</span>
          <input id="input-gps" type="text" class="hud-input text-[10px] py-0.5 text-amber-300 flex-1" value="10.817777858561, 106.70436976535" placeholder="Lat, Long" onchange="updateOSMMapFromInput()">
        </div>
      </div>

      <!-- Kích thước tự nhập -->
      <div class="grid grid-cols-5 gap-1 text-center mb-1.5">
        <div>
          <span class="text-[9px] text-slate-400 block mb-0.5">Rộng (m)</span>
          <input id="input-width" type="number" step="0.01" class="hud-input w-full text-center text-sky-300 font-bold" value="" oninput="recalculateValuation()">
        </div>
        <div>
          <span class="text-[9px] text-slate-400 block mb-0.5">Dài (m)</span>
          <input id="input-length" type="number" step="0.01" class="hud-input w-full text-center text-sky-300 font-bold" value="" oninput="recalculateValuation()">
        </div>
        <div>
          <span class="text-[9px] text-slate-400 block mb-0.5">Số tầng</span>
          <input id="input-floors" type="number" step="1" class="hud-input w-full text-center text-amber-300 font-bold" value="" oninput="recalculateValuation()">
        </div>
        <div>
          <span class="text-[9px] text-slate-400 block mb-0.5">DT Đất (m²)</span>
          <input id="input-land-area" type="number" step="0.1" class="hud-input w-full text-center text-emerald-400 font-bold" value="0" oninput="recalculateValuation()">
        </div>
        <div>
          <span class="text-[9px] text-slate-400 block mb-0.5">DT Sàn (m²)</span>
          <input id="input-build-area" type="number" step="0.1" class="hud-input w-full text-center text-emerald-400 font-bold" value="0" oninput="recalculateValuation()">
        </div>
      </div>

      <!-- Bảng kết quả định giá -->
      <div class="bg-gradient-to-r from-sky-950/60 via-slate-900/80 to-slate-950/60 border border-sky-500/30 rounded-xl p-2 mb-2">
        <div class="flex justify-between items-center mb-1 border-b border-sky-500/20 pb-0.5">
          <span class="text-[10px] font-extrabold text-sky-400 uppercase tracking-wider font-sans">KẾT QUẢ ĐỊNH GIÁ TỰ ĐỘNG</span>
          <span class="text-[9px] text-slate-400 font-mono">CL: <strong class="text-emerald-400 font-bold">85%</strong></span>
        </div>

        <div class="flex justify-between items-center">
          <div class="flex-1 pr-2 space-y-0.5 text-xs font-mono">
            <div class="flex justify-between text-slate-300">
              <span>QSD Đất:</span>
              <span id="land-val" class="font-bold text-slate-100">0 ₫</span>
            </div>
            <div class="flex justify-between text-slate-300">
              <span>Công trình XD:</span>
              <span id="build-val" class="font-bold text-slate-100">0 ₫</span>
            </div>
            <div class="border-t border-sky-500/30 pt-0.5 mt-0.5 flex justify-between items-center">
              <span class="text-[10px] font-bold text-emerald-400 uppercase font-sans">TỔNG GIÁ TRỊ:</span>
              <span id="total-val" class="text-xs font-black text-emerald-400">0 ₫</span>
            </div>
          </div>

          <div class="flex flex-col items-center justify-center pl-2 border-l border-slate-800">
            <div class="bg-white p-1 rounded-lg shadow-lg border border-sky-400 flex items-center justify-center">
              <canvas id="qr-canvas" class="w-20 h-20 block"></canvas>
            </div>
            <span class="text-[8px] text-sky-300 font-bold mt-0.5 font-mono tracking-wider">SCAN VALUE</span>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: QUẢN LÝ & LƯU TRỮ RANH ĐẤT POLYGON -->
    <div id="tab-content-polygon" class="flex-1 overflow-y-auto hidden pr-1">
      <!-- Khung nhập tài sản mới -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-2 mb-2 space-y-1.5">
        <input id="asset-name-input" type="text" class="hud-input w-full text-[11px]" placeholder="Tên / Địa chỉ tài sản...">
        <textarea id="polygon-coords-input" class="hud-input w-full h-16 font-mono text-[10px] leading-snug p-1.5" placeholder="Dán tọa độ (khoảng trắng / phẩy / tab):
10.817777858561 106.70436976535
10.817738858562 106.70437376644
10.817723858769 106.70423576637"></textarea>
        
        <div class="flex gap-1.5">
          <button onclick="saveCurrentPolygon()" class="btn-action-glow flex-1 py-1.5 rounded text-[10px] font-bold flex items-center justify-center gap-1">
            <i data-lucide="save" class="w-3 h-3"></i>
            <span>Lưu Máy</span>
          </button>
          <button onclick="syncToCloud()" class="py-1.5 px-2 bg-sky-600 hover:bg-sky-500 border border-sky-400/50 rounded text-[10px] text-white font-bold flex items-center gap-1">
            <i data-lucide="cloud-upload" class="w-3 h-3"></i>
            <span>Đồng bộ PC/Mobile</span>
          </button>
        </div>
      </div>

      <!-- Danh sách tài sản đã lưu -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <span class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">Tài sản đã lưu</span>
          <button onclick="clearAllSavedPolygons()" class="text-[9px] text-rose-400 hover:underline">Xóa tất cả</button>
        </div>
        <div id="saved-assets-list" class="space-y-1.5">
          <!-- Render danh sách ở đây -->
        </div>
      </div>
    </div>

    <!-- HÀNG NÚT THAO TÁC BOTTOM -->
    <div class="grid grid-cols-4 gap-1.5 pt-1.5 border-t border-slate-800">
      <button onclick="resetPoints()" class="py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-xl text-[11px] font-bold text-slate-300 flex items-center justify-center gap-1 transition shadow-md">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Đo lại</span>
      </button>

      <button onclick="takeScreenshot()" class="btn-action-glow py-2 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1">
        <i data-lucide="camera" class="w-3.5 h-3.5"></i>
        <span>Chụp ảnh</span>
      </button>

      <button onclick="confirmCustomer()" class="btn-action-glow py-2 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1">
        <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
        <span>Khách xác nhận</span>
      </button>
      
      <button id="save-btn" onclick="saveDataDirectly()" class="btn-action-glow py-2 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1">
        <i data-lucide="file-check" class="w-3.5 h-3.5"></i>
        <span>Sync & Report</span>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx3w-5j3oWFKABnpw9HINSjWokCkJExXX3fmR8eDTJg7mnPBlvc4TBNsxd936u8PUA7/exec";

    const video = document.getElementById('video-bg');
    const freezeCanvas = document.getElementById('freeze-canvas');
    const container = document.getElementById('canvas-container');
    const reticleUI = document.getElementById('reticle-ui');
    const infoPanel = document.getElementById('info-panel');
    const floatingActions = document.getElementById('floating-actions');
    const viewViewport = document.getElementById('view-viewport');
    const osmMiniMap = document.getElementById('osm-mini-map');

    let scene, camera, renderer, raycaster, mouse;
    const points = [], pointMarkers = [];
    let frameLine = null, gps3DGroup = null;
    let isPanelCollapsed = false;
    let isCustomerConfirmed = false;

    let mapOSM = null, markerOSM = null, osmPolygonLayer = null;
    let qrGenerator = null;

    const STORAGE_KEY = "SMARTVAL_SAVED_POLYGONS_V2";

    function getSavedPolygons() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function savePolygonData(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderSavedAssetsList();
    }

    function renderSavedAssetsList() {
      const list = getSavedPolygons();
      document.getElementById('saved-count').innerText = list.length;
      const container = document.getElementById('saved-assets-list');
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<p class="text-[10px] text-slate-500 italic text-center py-2">Chưa lưu tài sản nào (Tối đa 5 tài sản)</p>`;
        return;
      }

      list.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = "flex items-center justify-between bg-slate-900 border border-slate-800 p-1.5 rounded-lg text-[10px]";
        itemEl.innerHTML = `
          <div class="flex-1 pr-1 truncate">
            <p class="font-bold text-sky-300 truncate">${index + 1}. ${item.name || 'Thửa đất chưa tên'}</p>
            <p class="font-mono text-slate-400 text-[9px] truncate">${item.coords.length} mốc | ${item.coords[0][0]}, ${item.coords[0][1]}</p>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="applySavedPolygon(${index})" class="px-2 py-0.5 bg-emerald-600 text-white rounded font-bold hover:bg-emerald-500">Xem AR 3D</button>
            <button onclick="deleteSavedPolygon(${index})" class="px-1.5 py-0.5 bg-rose-900/60 text-rose-300 border border-rose-700/50 rounded hover:bg-rose-800">Xóa</button>
          </div>
        `;
        container.appendChild(itemEl);
      });
    }

    // ĐỒNG BỘ ĐA THIẾT BỊ PC <-> DI ĐỘNG QUA CLOUD
    window.syncToCloud = function() {
      const list = getSavedPolygons();
      if (list.length === 0) {
        alert("Chưa có tài sản nào để đồng bộ!");
        return;
      }

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "savePolygons", polygons: list })
      })
      .then(() => alert("Đã tải danh sách tài sản lên Cloud thành công! Khi mở điện thoại bấm nút 'GPS' hoặc vào tab Ranh GPS để xem."))
      .catch(err => alert("Lỗi đồng bộ Cloud: " + err));
    };

    window.saveCurrentPolygon = function() {
      const list = getSavedPolygons();
      if (list.length >= 5) {
        alert("Đã đạt tối đa 5 tài sản! Hãy xóa bớt tài sản cũ.");
        return;
      }

      const name = document.getElementById('asset-name-input').value.trim() || `Tài sản ${list.length + 1}`;
      const textVal = document.getElementById('polygon-coords-input').value.trim();

      if (!textVal) {
        alert("Vui lòng dán tọa độ GPS trước!");
        return;
      }

      const parsedCoords = parseCoordinates(textVal);
      if (parsedCoords.length < 3) {
        alert("Tọa độ không hợp lệ hoặc ít hơn 3 mốc!");
        return;
      }

      list.push({
        name: name,
        coords: parsedCoords,
        rawText: textVal,
        createdAt: new Date().toLocaleString('vi-VN')
      });

      savePolygonData(list);
      document.getElementById('asset-name-input').value = "";
      document.getElementById('polygon-coords-input').value = "";
      alert(`Đã lưu tài sản: ${name}`);
    };

    window.applySavedPolygon = function(index) {
      const list = getSavedPolygons();
      if (!list[index]) return;

      const item = list[index];
      renderPolygonOnMapAnd3D(item.coords);

      document.getElementById('input-address').value = item.name;
      document.getElementById('input-gps').value = `${item.coords[0][0]}, ${item.coords[0][1]}`;

      switchTab('survey');
      alert(`Đã hiển thị Khung Ranh 3D Dạ Quang trên màn hình Camera cho: ${item.name}`);
    };

    window.deleteSavedPolygon = function(index) {
      const list = getSavedPolygons();

    function parseCoordinates(text) {
      const lines = text.split('\n');
      const coords = [];
      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed) {
          const parts = trimmed.split(/[\s,;]+/).filter(Boolean);
          if (parts.length >= 2) {
            const lat = parseFloat(parts[0]);
            const lng = parseFloat(parts[1]);
            if (!isNaN(lat) && !isNaN(lng)) {
              coords.push([lat, lng]);
            }
          }
        }
      });
      return coords;
    }

    // SỬA LỖI VẼ KHUNG RANH 3D NỔI TRÊN MÀN HÌNH CAMERA AR
    function renderPolygonOnMapAnd3D(coords) {
      // 1. Cập nhật Bản đồ nhỏ OSM
      if (mapOSM) {
        if (osmPolygonLayer) mapOSM.removeLayer(osmPolygonLayer);
        osmPolygonLayer = L.polygon(coords, { color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.35 }).addTo(mapOSM);
        mapOSM.fitBounds(osmPolygonLayer.getBounds());
      }

      // 2. Dựng Khung Ranh 3D Dạ Quang nổi trên không gian Camera AR
      if (gps3DGroup) scene.remove(gps3DGroup);
      gps3DGroup = new THREE.Group();

      const originLat = coords[0][0];
      const originLng = coords[0][1];
      const poly3DPoints = [];

      coords.forEach((pt, idx) => {
        // Quy đổi độ lệch Lat/Long sang mét thực địa
        const dLatMeters = (pt[0] - originLat) * 111320;
        const dLngMeters = (pt[1] - originLng) * 40075000 * Math.cos(originLat * Math.PI / 180) / 360;

        // Chuẩn hóa quy mô sang hệ tọa độ Three.js AR Viewport
        const x = dLngMeters * 0.25;
        const y = dLatMeters * 0.25;
        const z = -1.5; // Đặt khung 3D phía trước camera

        const vec = new THREE.Vector3(x, y, z);
        poly3DPoints.push(vec);

        // Tạo Cột mốc 3D Neon tại các góc ranh
        const nodeSphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0x34d399 })
        );
        nodeSphere.position.copy(vec);
        gps3DGroup.add(nodeSphere);
      });

      // Nối kín các đỉnh ranh đất
      poly3DPoints.push(poly3DPoints[0]);

      const lineGeo = new THREE.BufferGeometry().setFromPoints(poly3DPoints);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 5 });
      const lineMesh = new THREE.Line(lineGeo, lineMat);

      gps3DGroup.add(lineMesh);
      scene.add(gps3DGroup);

      osmMiniMap.classList.remove('hidden');
    }

    function removeVietnameseTones(str) {
      if (!str) return '';
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
      str = str.replace(/đ/g, "d");
      str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
      str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
      str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
      str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
      str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
      str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
      str = str.replace(/Đ/g, "D");
      return str;
    }

    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });

    function initOSMMiniMap(lat = 10.817777858561, lng = 106.70436976535) {
      if (!mapOSM) {
        mapOSM = L.map('osm-mini-map', {
          zoomControl: false,
          attributionControl: false
        }).setView([lat, lng], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(mapOSM);

        markerOSM = L.marker([lat, lng]).addTo(mapOSM);
      } else {
        mapOSM.setView([lat, lng], 17);
        markerOSM.setLatLng([lat, lng]);
      }
    }

    function updateOSMMapFromInput() {
      const gpsVal = document.getElementById('input-gps').value.split(/[\s,;]+/);
      if (gpsVal.length >= 2) {

        const lng = parseFloat(gpsVal[1].trim());
        if (!isNaN(lat) && !isNaN(lng)) {

      const buildVal = document.getElementById('build-val').innerText;

        qrGenerator = new QRious({
          element: document.getElementById('qr-canvas'),

      if (customerName) {

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Không thể mở Camera. Vui lòng kiểm tra quyền trên trình duyệt!");
      }
    }

    function init3D() {
      const w = viewViewport.clientWidth;
      const h = viewViewport.clientHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 100);
      camera.position.set(0, 0, 5);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      window.addEventListener('resize', onWindowResize);
      container.addEventListener('pointerdown', onPointerDown);

      animate();
    }

    window.getLocationGPS = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            document.getElementById('input-gps').value = `${lat}, ${lng}`;
            initOSMMiniMap(lat, lng);
            generateValuationQR();
            alert(`Đã cập nhật tọa độ GPS: ${lat}, ${lng}`);
          },
          (error) => {
            alert("Lỗi lấy tọa độ GPS: " + error.message);
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("Trình duyệt không hỗ trợ Geolocation GPS!");
      }
    };

    function freezeCameraView() {
      const ctx = freezeCanvas.getContext('2d');
      const w = viewViewport.clientWidth;
      const h = viewViewport.clientHeight;
      freezeCanvas.width = video.videoWidth || w;
      freezeCanvas.height = video.videoHeight || h;
      ctx.drawImage(video, 0, 0, freezeCanvas.width, freezeCanvas.height);
      
      video.classList.add('hidden');
      freezeCanvas.classList.remove('hidden');

      document.getElementById('status-ping').className = "relative inline-flex rounded-full h-1.5 w-1.5 bg-amber-500";
      document.getElementById('status-dot').className = "relative inline-flex rounded-full h-1.5 w-1.5 bg-amber-500";
      document.getElementById('status-text').innerText = "FROZEN";

      osmMiniMap.classList.remove('hidden');
      if (mapOSM) mapOSM.invalidateSize();
    }

    function onPointerDown(event) {
      if (points.length >= 4) return;

      const rect = container.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const targetZ = 0;
      const distance = (targetZ - raycaster.ray.origin.z) / raycaster.ray.direction.z;
      const pointPosition = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(distance));

      const markerGroup = new THREE.Group();
      const coreMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      const ringMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.05, 0.07, 32),
        new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide })
      );

      markerGroup.add(coreMesh);
      markerGroup.add(ringMesh);
      markerGroup.position.copy(pointPosition);

      scene.add(markerGroup);
      points.push(pointPosition);
      pointMarkers.push(markerGroup);

      document.getElementById('point-count').innerText = `${points.length} / 4`;

      if (points.length === 4) {
        drawFrame();
        freezeCameraView();
        
        const w = points[0].distanceTo(points[1]) * 1.5;
        const h = points[1].distanceTo(points[2]) * 1.5;
        const floors = Math.max(1, Math.round(h / 3.2));
        
        document.getElementById('input-width').value = w.toFixed(2);
        document.getElementById('input-length').value = (w * 3.5).toFixed(2);
        document.getElementById('input-floors').value = floors;
        
        recalculateValuation();

        reticleUI.style.display = 'none';
        document.getElementById('instruction').innerText = "Khảo sát hoàn tất";
        floatingActions.classList.remove('hidden');
        floatingActions.classList.add('flex');
      } else {
        document.getElementById('instruction').innerText = `Chạm chọn góc thứ ${points.length + 1}`;
      }
    }

    function drawFrame() {
      if (frameLine) scene.remove(frameLine);
      const linePoints = [points[0], points[1], points[2], points[3], points[0]];
      const geometry = new THREE.BufferGeometry().setFromPoints(linePoints);
      const material = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 3 });
      frameLine = new THREE.Line(geometry, material);
      scene.add(frameLine);
    }

      ctx.fillStyle = 'rgba(5, 11, 20, 0.75)';

      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${landVal}`, 520, cardY + 320);

      ctx.fillText(`Giá trị Công trình xây dựng:`, 60, cardY + 390);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${buildVal}`, 520, cardY + 390);

      ctx.font = 'bold 34px sans-serif';

    window.recalculateValuation = function() {
      const width = parseFloat(document.getElementById('input-width').value) || 0;
      const length = parseFloat(document.getElementById('input-length').value) || 0;
      const floors = parseInt(document.getElementById('input-floors').value) || 1;

      let landArea = parseFloat(document.getElementById('input-land-area').value);
      if (!landArea || landArea === 0) {
        landArea = width * length;
        document.getElementById('input-land-area').value = landArea.toFixed(1);
      }

      let buildArea = parseFloat(document.getElementById('input-build-area').value);
      if (!buildArea || buildArea === 0) {
        buildArea = landArea * floors;
        document.getElementById('input-build-area').value = buildArea.toFixed(1);
      }

      const unitLandPrice = 114960000;
      const unitBuildPrice = 7000000;
      const qualityRatio = 0.85;

      const landVal = landArea * unitLandPrice;
      const buildVal = buildArea * unitBuildPrice * qualityRatio;
      const totalVal = landVal + buildVal;

      document.getElementById('land-val').innerText = `${Math.round(landVal).toLocaleString('vi-VN')} ₫`;
      document.getElementById('build-val').innerText = `${Math.round(buildVal).toLocaleString('vi-VN')} ₫`;
      document.getElementById('total-val').innerText = `${Math.round(totalVal).toLocaleString('vi-VN')} ₫`;

      generateValuationQR();
    };

    window.resetPoints = function() {
      points.length = 0;
      pointMarkers.forEach(m => scene.remove(m));
      pointMarkers.length = 0;
      if (frameLine) scene.remove(frameLine);
      isCustomerConfirmed = false;

      freezeCanvas.classList.add('hidden');
      video.classList.remove('hidden');

      osmMiniMap.classList.add('hidden');

      document.getElementById('status-ping').className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
      document.getElementById('status-dot').className = "relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500";
      document.getElementById('status-text').innerText = "LIVE";

      reticleUI.style.display = 'block';
      document.getElementById('point-count').innerText = "0 / 4";
      document.getElementById('instruction').innerText = "Chạm màn hình chọn 4 điểm";
      floatingActions.classList.add('hidden');
      floatingActions.classList.remove('flex');
    };

    window.saveDataDirectly = function() {
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>Đang gửi...</span>`;

      const payload = {
        appraiserName: "Phạm Minh Tuấn",
        address: document.getElementById('input-address').value,
        gps: document.getElementById('input-gps').value,
        width: document.getElementById('input-width').value,
        length: document.getElementById('input-length').value,
        floors: document.getElementById('input-floors').value,
        landArea: document.getElementById('input-land-area').value,
        buildArea: document.getElementById('input-build-area').value,
        customerConfirmed: isCustomerConfirmed,
        points: points.map(p => ({ x: p.x.toFixed(3), y: p.y.toFixed(3), z: p.z.toFixed(3) }))
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Đã đồng bộ dữ liệu khảo sát & Tọa độ GPS vào Google Sheets thành công!");
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i data-lucide="file-check" class="w-3.5 h-3.5"></i><span>Sync & Report</span>`;
        lucide.createIcons();
      })
      .catch(err => {
        alert("Lỗi gửi dữ liệu: " + err);
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i data-lucide="file-check" class="w-3.5 h-3.5"></i><span>Sync & Report</span>`;
        lucide.createIcons();
      });
    };

    function onWindowResize() {
      const w = viewViewport.clientWidth;
      const h = viewViewport.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    startCamera();
    init3D();
    initOSMMiniMap();
    generateValuationQR();
    renderSavedAssetsList();
  </script>
