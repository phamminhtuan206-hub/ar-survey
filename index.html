<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartVal Pro - AR Field Survey & Automated Valuation</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS (Bản đồ OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- QRious JS Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #050b14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    #view-viewport {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 50vh;
      overflow: hidden;
      background: #000;
      border-bottom: 2px solid rgba(56, 189, 248, 0.4);
    }

    #video-bg, #freeze-canvas, #canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #canvas-container {
      z-index: 2;
      pointer-events: auto;
    }

    /* Bản đồ nhỏ OSM góc dưới bên phải khu vực AR */
    #osm-mini-map {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 130px; height: 110px;
      z-index: 10;
      border: 2px solid #0284c7;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.6);
      overflow: hidden;
    }

    #reticle-ui {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      z-index: 15;
      pointer-events: none;
    }
    #reticle-ui::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 2px solid rgba(56, 189, 248, 0.6);
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
    }
    #reticle-ui::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 4px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .hud-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #f8fafc;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      font-family: monospace;
      outline: none;
      transition: all 0.2s;
    }
    .hud-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body class="text-slate-100 select-none">

  <!-- KHU VỰC AR VIEWPORT PHÍA TRÊN -->
  <div id="view-viewport">
    <video id="video-bg" autoplay playsinline muted></video>
    <canvas id="freeze-canvas" class="hidden"></canvas>
    <div id="canvas-container"></div>
    <div id="reticle-ui"></div>

    <!-- BẢN ĐỒ NHỎ OSM ĐỊNH VỊ GÓC DƯỚI BÊN PHẢI -->
    <div id="osm-mini-map"></div>

    <!-- Header HUD -->
    <header class="absolute top-0 left-0 right-0 z-20 p-2.5 bg-gradient-to-b from-slate-950/90 via-slate-950/40 to-transparent pointer-events-none">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <div class="w-7 h-7 rounded-lg bg-sky-500/20 border border-sky-400/50 flex items-center justify-center backdrop-blur-md">
            <i data-lucide="box" class="w-4 h-4 text-sky-400"></i>
          </div>
          <div>
            <div class="flex items-center gap-1">
              <span class="text-xs font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-emerald-400">SmartVal</span>
              <span class="text-[10px] px-1 py-0.2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded font-semibold">Pro</span>
            </div>
            <p id="instruction" class="text-[10px] text-slate-300">Chạm màn hình chọn 4 điểm</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 bg-slate-900/80 border border-slate-700/60 pl-2 pr-2.5 py-0.5 rounded-full backdrop-blur-md">
          <div class="w-5 h-5 rounded-full bg-sky-600/40 border border-sky-400/60 flex items-center justify-center text-[9px] font-bold text-sky-300">
            PT
          </div>
          <div class="text-right">
            <p class="text-[9px] font-medium text-slate-300 leading-tight">Chuyên gia thẩm định</p>
            <p class="text-[10px] font-bold text-sky-400 leading-tight">Phạm Minh Tuấn</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Live Status HUD -->
    <div class="absolute top-12 left-0 right-0 z-20 px-2.5 pointer-events-none">
      <div class="max-w-md mx-auto flex justify-between items-center text-[10px]">
        <div class="flex items-center gap-1.5 bg-slate-950/70 border border-slate-800/80 px-2 py-0.5 rounded backdrop-blur-md">
          <span class="relative flex h-1.5 w-1.5">
            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="status-dot" class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
          </span>
          <span id="status-text" class="text-slate-300 font-mono text-[9px]">LIVE</span>
        </div>

        <div class="flex items-center gap-1 bg-slate-950/80 border border-sky-500/30 px-2 py-0.5 rounded backdrop-blur-md text-sky-300 font-mono text-[9px]">
          <i data-lucide="clock" class="w-2.5 h-2.5 text-sky-400"></i>
          <span id="realtime-clock">--/--/---- --:--:--</span>
        </div>

        <div class="flex items-center gap-1 bg-slate-950/70 border border-slate-800/80 px-2 py-0.5 rounded backdrop-blur-md">
          <span class="text-slate-400 uppercase text-[9px]">ĐIỂM:</span>
          <span id="point-count" class="font-mono font-bold text-amber-400 text-[10px]">0 / 4</span>
        </div>
      </div>
    </div>

    <!-- Nút Thao Tác Ẩn / Chụp -->
    <div id="floating-actions" class="absolute top-20 right-2.5 z-30 hidden flex-col gap-1.5">
      <button onclick="toggleInfoPanel()" class="p-2 bg-slate-900/90 border border-sky-500/50 hover:bg-slate-800 rounded-full text-sky-400 shadow-lg backdrop-blur-md transition active:scale-95">
        <i id="toggle-icon" data-lucide="eye-off" class="w-4 h-4"></i>
      </button>
      <button onclick="takeScreenshot()" class="p-2 bg-emerald-600/90 border border-emerald-400/50 hover:bg-emerald-500 rounded-full text-white shadow-lg backdrop-blur-md transition active:scale-95">
        <i data-lucide="camera" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN NỬA DƯỚI -->
  <div id="info-panel" class="fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto bg-slate-950 border-t border-sky-500/40 p-3 shadow-2xl transition-all duration-300 h-[50vh] overflow-y-auto">
    
    <div class="border-b border-slate-800/80 pb-1.5 mb-1.5">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-1 text-[11px] text-sky-400 font-semibold uppercase tracking-wide">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
          <span>Vị trí khảo sát</span>
        </div>
        <button onclick="getLocationGPS()" class="flex items-center gap-1 px-2 py-0.5 bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/50 rounded text-[10px] text-sky-300 font-medium transition active:scale-95">
          <i data-lucide="crosshair" class="w-3 h-3 text-sky-400"></i>
          <span>GPS</span>
        </button>
      </div>

      <input id="input-address" type="text" class="hud-input w-full font-sans text-xs text-slate-100 font-semibold" value="" placeholder="Nhập địa chỉ bất động sản..." oninput="generateValuationQR()">
      
      <div class="flex items-center gap-1 mt-1 text-[10px] text-slate-400 font-mono">
        <span>Tọa độ:</span>
        <input id="input-gps" type="text" class="hud-input text-[10px] py-0.5 text-amber-300 flex-1" value="10.769104, 106.682382" placeholder="Lat, Long" onchange="updateOSMMapFromInput()">
      </div>
    </div>

    <!-- Kích thước tự nhập -->
    <div class="grid grid-cols-5 gap-1 text-center mb-1.5">
      <div>
        <span class="text-[9px] text-slate-400 block mb-0.5">Rộng (m)</span>
        <input id="input-width" type="number" step="0.01" class="hud-input w-full text-center text-sky-300 font-bold" value="" oninput="recalculateValuation()">
      </div>
      <div>
        <span class="text-[9px] text-slate-400 block mb-0.5">Dài (m)</span>
        <input id="input-length" type="number" step="0.01" class="hud-input w-full text-center text-sky-300 font-bold" value="" oninput="recalculateValuation()">
      </div>
      <div>
        <span class="text-[9px] text-slate-400 block mb-0.5">Số tầng</span>
        <input id="input-floors" type="number" step="1" class="hud-input w-full text-center text-amber-300 font-bold" value="" oninput="recalculateValuation()">
      </div>
      <div>
        <span class="text-[9px] text-slate-400 block mb-0.5">DT Đất (m²)</span>
        <input id="input-land-area" type="number" step="0.1" class="hud-input w-full text-center text-emerald-400 font-bold" value="0" oninput="recalculateValuation()">
      </div>
      <div>
        <span class="text-[9px] text-slate-400 block mb-0.5">DT Sàn (m²)</span>
        <input id="input-build-area" type="number" step="0.1" class="hud-input w-full text-center text-emerald-400 font-bold" value="0" oninput="recalculateValuation()">
      </div>
    </div>

    <!-- Bảng Kết Quả Định Giá Tự Động & Mã QR Code To Rõ Dễ Quét -->
    <div class="bg-gradient-to-r from-sky-950/60 via-slate-900/80 to-slate-950/60 border border-sky-500/30 rounded-xl p-2 mb-2 flex justify-between items-center">
      <div class="flex-1 pr-2">
        <div class="flex justify-between items-center mb-1 text-[10px]">
          <span class="font-semibold text-sky-400 uppercase tracking-wide">KẾT QUẢ ĐỊNH GIÁ TỰ ĐỘNG</span>
          <span class="text-slate-400">CL: <strong class="text-emerald-400">85%</strong></span>
        </div>
        
        <div class="space-y-0.5 text-xs font-mono">
          <div class="flex justify-between text-slate-300">
            <span>QSD Đất:</span>
            <span id="land-val" class="font-bold text-slate-100">0 ₫</span>
          </div>
          <div class="flex justify-between text-slate-300">
            <span>Công trình XD:</span>
            <span id="build-val" class="font-bold text-slate-100">0 ₫</span>
          </div>
          <div class="border-t border-sky-500/30 pt-1 mt-1 flex justify-between items-center">
            <span class="text-[11px] font-bold text-emerald-400 uppercase font-sans">TỔNG GIÁ TRỊ:</span>
            <span id="total-val" class="text-xs font-black text-emerald-400">0 ₫</span>
          </div>
        </div>
      </div>

      <!-- Khung hiển thị Mã QR CODE ĐƯỢC PHÓNG TO (120x120px) DỄ QUÉT -->
      <div class="flex flex-col items-center justify-center pl-2 border-l border-slate-800">
        <div class="bg-white p-1.5 rounded-lg shadow-lg border border-sky-400 flex items-center justify-center">
          <canvas id="qr-canvas" class="w-28 h-28 block"></canvas>
        </div>
        <span class="text-[9px] text-sky-300 font-bold mt-1 font-mono tracking-wider">SCAN VALUE</span>
      </div>
    </div>

    <!-- Hàng nút bấm thao tác (Đã bổ sung nút Khách hàng xác nhận) -->
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="resetPoints()" class="py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-xl text-[11px] font-bold text-slate-300 flex items-center justify-center gap-1 transition">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Đo lại</span>
      </button>

      <button onclick="takeScreenshot()" class="py-2 bg-emerald-700 hover:bg-emerald-600 active:scale-95 border border-emerald-600 rounded-xl text-[11px] font-bold text-white flex items-center justify-center gap-1 transition">
        <i data-lucide="camera" class="w-3.5 h-3.5"></i>
        <span>Chụp ảnh</span>
      </button>

      <!-- Nút Khách Hàng Xác Nhận Mới -->
      <button onclick="confirmCustomer()" class="py-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 border border-indigo-400/60 rounded-xl text-[11px] font-bold text-white shadow-md flex items-center justify-center gap-1 transition">
        <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
        <span>Khách xác nhận</span>
      </button>
      
      <button id="save-btn" onclick="saveDataDirectly()" class="py-2 bg-gradient-to-r from-sky-600 to-emerald-600 hover:from-sky-500 hover:to-emerald-500 active:scale-95 rounded-xl text-[11px] font-bold text-white shadow-lg shadow-sky-600/30 flex items-center justify-center gap-1 transition">
        <i data-lucide="file-check" class="w-3.5 h-3.5"></i>
        <span>Sync & Report</span>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx3w-5j3oWFKABnpw9HINSjWokCkJExXX3fmR8eDTJg7mnPBlvc4TBNsxd936u8PUA7/exec";

    const video = document.getElementById('video-bg');
    const freezeCanvas = document.getElementById('freeze-canvas');
    const container = document.getElementById('canvas-container');
    const reticleUI = document.getElementById('reticle-ui');
    const infoPanel = document.getElementById('info-panel');
    const floatingActions = document.getElementById('floating-actions');
    const viewViewport = document.getElementById('view-viewport');

    let scene, camera, renderer, raycaster, mouse;
    const points = [], pointMarkers = [];
    let frameLine = null;
    let isPanelCollapsed = false;
    let isCustomerConfirmed = false;

    let mapOSM = null, markerOSM = null;
    let qrGenerator = null;

    // 1. Cập nhật Đồng hồ Realtime
    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('vi-VN', { hour12: false });
      document.getElementById('realtime-clock').innerText = `${dateStr} ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Khởi tạo Bản đồ nhỏ OSM
    function initOSMMiniMap(lat = 10.769104, lng = 106.682382) {
      if (!mapOSM) {
        mapOSM = L.map('osm-mini-map', {
          zoomControl: false,
          attributionControl: false
        }).setView([lat, lng], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(mapOSM);

        markerOSM = L.marker([lat, lng]).addTo(mapOSM);
      } else {
        mapOSM.setView([lat, lng], 16);
        markerOSM.setLatLng([lat, lng]);
      }
    }

    function updateOSMMapFromInput() {
      const gpsVal = document.getElementById('input-gps').value.split(',');
      if (gpsVal.length === 2) {
        const lat = parseFloat(gpsVal[0].trim());
        const lng = parseFloat(gpsVal[1].trim());
        if (!isNaN(lat) && !isNaN(lng)) {
          initOSMMiniMap(lat, lng);
        }
      }
    }

    // 3. Khởi tạo và Tạo Mã QR Code TO RÕ - Siêu Nét Dễ Quét
    function generateValuationQR() {
      const addr = document.getElementById('input-address').value || 'Chưa nhập địa chỉ';
      const landVal = document.getElementById('land-val').innerText;
      const buildVal = document.getElementById('build-val').innerText;
      const totalVal = document.getElementById('total-val').innerText;

      const qrText = `KẾT QUẢ THẨM ĐỊNH GIÁ - SMARTVAL PRO\nĐịa chỉ: ${addr}\n- QSD Đất: ${landVal}\n- Công trình XD: ${buildVal}\n=> TỔNG GIÁ TRỊ: ${totalVal}\nThẩm định viên: Phạm Minh Tuấn`;

      if (!qrGenerator) {
        qrGenerator = new QRious({
          element: document.getElementById('qr-canvas'),
          size: 300, // Kích thước ma trận gốc 300x300 siêu nét
          value: qrText,
          background: 'white',
          foreground: '#0f172a',
          level: 'H' // Error Correction Level High giúp máy ảnh dễ quét
        });
      } else {
        qrGenerator.value = qrText;
      }
    }

    // 4. Xử lý Nút Khách Hàng Xác Nhận
    window.confirmCustomer = function() {
      const customerName = prompt("Nhập tên khách hàng / chủ tài sản xác nhận:", "Nguyễn Văn A");
      if (customerName) {
        isCustomerConfirmed = true;
        alert(`Đã ghi nhận xác nhận khảo sát hiện trường từ Khách hàng: ${customerName}`);
      }
    };

    // 5. Kích hoạt Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Không thể mở Camera. Vui lòng kiểm tra quyền trên trình duyệt!");
      }
    }

    // 6. Khởi tạo Three.js Canvas
    function init3D() {
      const w = viewViewport.clientWidth;
      const h = viewViewport.clientHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 100);
      camera.position.set(0, 0, 5);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      window.addEventListener('resize', onWindowResize);
      container.addEventListener('pointerdown', onPointerDown);

      animate();
    }

    // Lấy GPS
    window.getLocationGPS = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            document.getElementById('input-gps').value = `${lat}, ${lng}`;
            initOSMMiniMap(lat, lng);
            generateValuationQR();
            alert(`Đã cập nhật tọa độ GPS: ${lat}, ${lng}`);
          },
          (error) => {
            alert("Lỗi lấy tọa độ GPS: " + error.message);
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("Trình duyệt không hỗ trợ Geolocation GPS!");
      }
    };

    // 7. Đóng Băng Khung Hình Camera
    function freezeCameraView() {
      const ctx = freezeCanvas.getContext('2d');
      const w = viewViewport.clientWidth;
      const h = viewViewport.clientHeight;
      freezeCanvas.width = video.videoWidth || w;
      freezeCanvas.height = video.videoHeight || h;
      ctx.drawImage(video, 0, 0, freezeCanvas.width, freezeCanvas.height);
      
      video.classList.add('hidden');
      freezeCanvas.classList.remove('hidden');

      document.getElementById('status-ping').className = "relative inline-flex rounded-full h-1.5 w-1.5 bg-amber-500";
      document.getElementById('status-dot').className = "relative inline-flex rounded-full h-1.5 w-1.5 bg-amber-500";
      document.getElementById('status-text').innerText = "FROZEN";
    }

    // 8. Xử lý Chạm Chọn Điểm
    function onPointerDown(event) {
      if (points.length >= 4) return;

      const rect = container.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const targetZ = 0;
      const distance = (targetZ - raycaster.ray.origin.z) / raycaster.ray.direction.z;
      const pointPosition = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(distance));

      const markerGroup = new THREE.Group();
      const coreMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      const ringMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.05, 0.07, 32),
        new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide })
      );

      markerGroup.add(coreMesh);
      markerGroup.add(ringMesh);
      markerGroup.position.copy(pointPosition);

      scene.add(markerGroup);
      points.push(pointPosition);
      pointMarkers.push(markerGroup);

      document.getElementById('point-count').innerText = `${points.length} / 4`;

      if (points.length === 4) {
        drawFrame();
        freezeCameraView();
        
        const w = points[0].distanceTo(points[1]) * 1.5;
        const h = points[1].distanceTo(points[2]) * 1.5;
        const floors = Math.max(1, Math.round(h / 3.2));
        
        document.getElementById('input-width').value = w.toFixed(2);
        document.getElementById('input-length').value = (w * 3.5).toFixed(2);
        document.getElementById('input-floors').value = floors;
        
        recalculateValuation();

        reticleUI.style.display = 'none';
        document.getElementById('instruction').innerText = "Khảo sát hoàn tất";
        floatingActions.classList.remove('hidden');
        floatingActions.classList.add('flex');
      } else {
        document.getElementById('instruction').innerText = `Chạm chọn góc thứ ${points.length + 1}`;
      }
    }

    function drawFrame() {
      if (frameLine) scene.remove(frameLine);
      const linePoints = [points[0], points[1], points[2], points[3], points[0]];
      const geometry = new THREE.BufferGeometry().setFromPoints(linePoints);
      const material = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 3 });
      frameLine = new THREE.Line(geometry, material);
      scene.add(frameLine);
    }

    // 9. Bật / Tắt Xem Trọn Vẹn Ảnh
    window.toggleInfoPanel = function() {
      isPanelCollapsed = !isPanelCollapsed;
      const toggleIcon = document.getElementById('toggle-icon');

      if (isPanelCollapsed) {
        infoPanel.classList.add('hidden');
        viewViewport.style.height = '100vh';
        toggleIcon.setAttribute('data-lucide', 'eye');
      } else {
        infoPanel.classList.remove('hidden');
        viewViewport.style.height = '50vh';
        toggleIcon.setAttribute('data-lucide', 'eye-off');
      }
      onWindowResize();
      if (mapOSM) mapOSM.invalidateSize();
      lucide.createIcons();
    };

    // 10. Chụp Ảnh Chứng Thư Kết Hợp Đủ Thông Tin
    window.takeScreenshot = function() {
      const exportCanvas = document.createElement('canvas');
      const canvasW = 1080;
      const canvasH = 1920;
      exportCanvas.width = canvasW;
      exportCanvas.height = canvasH;
      const ctx = exportCanvas.getContext('2d');

      ctx.fillStyle = '#050b14';
      ctx.fillRect(0, 0, canvasW, canvasH);

      // 1. Vẽ Ảnh Camera / Freeze
      const photoH = 1100;
      if (!freezeCanvas.classList.contains('hidden')) {
        ctx.drawImage(freezeCanvas, 0, 0, canvasW, photoH);
      } else {
        ctx.drawImage(video, 0, 0, canvasW, photoH);
      }

      // 2. Vẽ Lớp Khung 3D Mỏ Neo
      ctx.drawImage(renderer.domElement, 0, 0, canvasW, photoH);

      // 3. Vẽ Watermark Header
      ctx.fillStyle = 'rgba(5, 11, 20, 0.75)';
      ctx.fillRect(0, 0, canvasW, 140);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('SmartVal Pro - Kết quả Khảo Sát Hiện Trường', 40, 60);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '24px monospace';
      const clockStr = document.getElementById('realtime-clock').innerText;
      const gpsStr = document.getElementById('input-gps').value;
      ctx.fillText(`Thời gian: ${clockStr} | GPS: ${gpsStr}`, 40, 105);

      // 4. Vẽ QR Code To Rõ Lên Bức Ảnh Chụp
      const qrCanvasSrc = document.getElementById('qr-canvas');
      if (qrCanvasSrc) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(canvasW - 240, 160, 200, 200);
        ctx.drawImage(qrCanvasSrc, canvasW - 230, 170, 180, 180);
      }

      // 5. Vẽ Card Thông Tin Thẩm Định
      const cardY = photoH + 40;
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(30, cardY, canvasW - 60, 720);
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 4;
      ctx.strokeRect(30, cardY, canvasW - 60, 720);

      const addr = document.getElementById('input-address').value || 'Chưa xác định';
      const wVal = document.getElementById('input-width').value || '0';
      const lVal = document.getElementById('input-length').value || '0';
      const fVal = document.getElementById('input-floors').value || '0';
      const landA = document.getElementById('input-land-area').value || '0';
      const buildA = document.getElementById('input-build-area').value || '0';

      const landVal = document.getElementById('land-val').innerText;
      const buildVal = document.getElementById('build-val').innerText;
      const totalVal = document.getElementById('total-val').innerText;

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText(`ĐỊA CHỈ: ${addr}`, 60, cardY + 70);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '28px sans-serif';
      ctx.fillText(`Kích thước: Rộng ${wVal}m x Dài ${lVal}m | Số tầng: ${fVal}`, 60, cardY + 140);
      ctx.fillText(`DT Đất: ${landA} m² | DT Sàn xây dựng: ${buildA} m²`, 60, cardY + 200);

      ctx.strokeStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(60, cardY + 240);
      ctx.lineTo(canvasW - 60, cardY + 240);
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.font = '28px monospace';
      ctx.fillText(`Giá trị QSD Đất:`, 60, cardY + 320);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${landVal}`, 600, cardY + 320);

      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Giá trị Công trình xây dựng:`, 60, cardY + 390);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${buildVal}`, 600, cardY + 390);

      ctx.fillStyle = '#34d399';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText(`TỔNG GIÁ TRỊ THẨM ĐỊNH:`, 60, cardY + 500);
      ctx.font = 'bold 42px monospace';
      ctx.fillText(`${totalVal}`, 60, cardY + 570);

      const confirmStatusText = isCustomerConfirmed ? "ĐÃ XÁC NHẬN BỞI KHÁCH HÀNG" : "CHỜ XÁC NHẬN";
      ctx.fillStyle = '#64748b';
      ctx.font = 'italic 22px sans-serif';
      ctx.fillText(`Thẩm định viên: Phạm Minh Tuấn | ${confirmStatusText}`, 60, cardY + 660);

      const link = document.createElement('a');
      link.download = `SmartVal_Report_${Date.now()}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    };

    window.recalculateValuation = function() {
      const width = parseFloat(document.getElementById('input-width').value) || 0;
      const length = parseFloat(document.getElementById('input-length').value) || 0;
      const floors = parseInt(document.getElementById('input-floors').value) || 1;

      let landArea = parseFloat(document.getElementById('input-land-area').value);
      if (!landArea || landArea === 0) {
        landArea = width * length;
        document.getElementById('input-land-area').value = landArea.toFixed(1);
      }

      let buildArea = parseFloat(document.getElementById('input-build-area').value);
      if (!buildArea || buildArea === 0) {
        buildArea = landArea * floors;
        document.getElementById('input-build-area').value = buildArea.toFixed(1);
      }

      const unitLandPrice = 114960000;
      const unitBuildPrice = 7000000;
      const qualityRatio = 0.85;

      const landVal = landArea * unitLandPrice;
      const buildVal = buildArea * unitBuildPrice * qualityRatio;
      const totalVal = landVal + buildVal;

      document.getElementById('land-val').innerText = `${Math.round(landVal).toLocaleString('vi-VN')} ₫`;
      document.getElementById('build-val').innerText = `${Math.round(buildVal).toLocaleString('vi-VN')} ₫`;
      document.getElementById('total-val').innerText = `${Math.round(totalVal).toLocaleString('vi-VN')} ₫`;

      generateValuationQR();
    };

    window.resetPoints = function() {
      points.length = 0;
      pointMarkers.forEach(m => scene.remove(m));
      pointMarkers.length = 0;
      if (frameLine) scene.remove(frameLine);
      isCustomerConfirmed = false;

      freezeCanvas.classList.add('hidden');
      video.classList.remove('hidden');

      document.getElementById('status-ping').className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
      document.getElementById('status-dot').className = "relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500";
      document.getElementById('status-text').innerText = "LIVE";

      reticleUI.style.display = 'block';
      document.getElementById('point-count').innerText = "0 / 4";
      document.getElementById('instruction').innerText = "Chạm màn hình chọn 4 điểm";
      floatingActions.classList.add('hidden');
      floatingActions.classList.remove('flex');
    };

    window.saveDataDirectly = function() {
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>Đang gửi...</span>`;

      const payload = {
        appraiserName: "Phạm Minh Tuấn",
        address: document.getElementById('input-address').value,
        gps: document.getElementById('input-gps').value,
        width: document.getElementById('input-width').value,
        length: document.getElementById('input-length').value,
        floors: document.getElementById('input-floors').value,
        landArea: document.getElementById('input-land-area').value,
        buildArea: document.getElementById('input-build-area').value,
        customerConfirmed: isCustomerConfirmed,
        points: points.map(p => ({ x: p.x.toFixed(3), y: p.y.toFixed(3), z: p.z.toFixed(3) }))
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Đã đồng bộ dữ liệu khảo sát & Tọa độ GPS vào Google Sheets thành công!");
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i data-lucide="file-check" class="w-3.5 h-3.5"></i><span>Sync & Report</span>`;
        lucide.createIcons();
      })
      .catch(err => {
        alert("Lỗi gửi dữ liệu: " + err);
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i data-lucide="file-check" class="w-3.5 h-3.5"></i><span>Sync & Report</span>`;
        lucide.createIcons();
      });
    };

    function onWindowResize() {
      const w = viewViewport.clientWidth;
      const h = viewViewport.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    startCamera();
    init3D();
    initOSMMiniMap();
    generateValuationQR();
  </script>
</body>
</html>
